<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Street Fight sound board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:18px;background:#101114;color:#eee;font:15px/1.4 system-ui,sans-serif}h1{font-size:18px;margin:0 0 4px}p{color:#aaa;margin:0 0 14px;max-width:60em}section{margin:0 0 14px}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#e6b450;margin:0 0 6px}button{margin:0 6px 6px 0;padding:8px 12px;background:#23252b;border:1px solid #444;border-radius:4px;color:#eee;font:inherit;cursor:pointer}button:hover{background:#30333b}input{vertical-align:middle}</style>
</head><body>
<h1>Street Fight sound board</h1>
<p>Plays the real <code>gfx/arena/audio.js</code> events, for a person to judge. The sounds are synthesised; on the build side they were only measured, never heard. Crowd level below stands in for the state of the fight.</p>
<section id="s"></section>
<script type="module">
import { createAudio } from '../arena/audio.js';
const audio = createAudio({ enabled: true, volume: 0.8 });
audio.unlock();
window.AUDIO = audio;
const dirs = [1, 0];
const H = (kind, power, tgt, extra = {}) => ({ type: 'hit', who: 'p', kind, tgt, power, dir: dirs, blocked: false, clean: tgt === 'head', ...extra });
const B = (kind, power) => ({ type: 'block', who: 'p', kind, tgt: 'head', power, dir: dirs, blocked: true });
const groups = {
  Punches: { 'Jab': H('jab', 0.28, 'head'), 'Cross': H('cross', 0.6, 'head'), 'Lead hook': H('hook', 0.85, 'head'), 'Uppercut': H('upper', 0.85, 'head'), 'Body left': H('bodyL', 0.5, 'body'), 'Body right': H('bodyR', 0.6, 'body'), 'Hook, counter': H('hook', 1, 'head', { counter: true }), 'Cross, blocked': B('cross', 0.27), 'Hook, blocked': B('hook', 0.38) },
  Movement: { 'Throw jab': { type: 'throw', power: 0.28 }, 'Throw hook': { type: 'throw', power: 0.85 }, 'Whiff': { type: 'whiff', power: 0.6 }, 'Slipped': { type: 'slipped', power: 0.6 }, 'Step soft': { type: 'step', power: 0.4 }, 'Step hard': { type: 'step', power: 1 }, 'Into the ropes': { type: 'rope', power: 0.7 } },
  Fight: { 'Count': { type: 'count', n: 3 }, 'Get up': { type: 'getup' }, 'Bell': { type: 'bell' }, 'Fight (second strike)': { type: 'fight' }, 'Round end (two more)': { type: 'round_end' }, 'Stopped (three more)': { type: 'stopped' } },
};
const root = document.getElementById('s');
for (const [g, items] of Object.entries(groups)) {
  const h = document.createElement('h2'); h.textContent = g; root.appendChild(h);
  for (const [name, ev] of Object.entries(items)) { const b = document.createElement('button'); b.textContent = name; b.onclick = () => audio.onEvent({ ...ev }); root.appendChild(b); }
}
const h2 = document.createElement('h2'); h2.textContent = 'Crowd'; root.appendChild(h2);
const land = document.createElement('button'); land.textContent = 'Body lands on canvas'; land.onclick = () => audio.land(); root.appendChild(land);
const roar = document.createElement('button'); roar.textContent = 'Knockdown roar'; roar.onclick = () => audio.onEvent({ type: 'knockdown' }); root.appendChild(roar);
const fake = { state: 'fight', clock: 40, p: { hp: 80 }, o: { hp: 80 } };
const sel = document.createElement('select'); for (const s of ['fight', 'intro', 'down', 'break', 'over']) sel.add(new Option(s)); sel.onchange = () => { fake.state = sel.value; }; root.appendChild(sel);
let last = performance.now(); (function tick(now) { audio.update(fake, Math.min(0.1, (now - last) / 1000)); last = now; requestAnimationFrame(tick); })(last);
await audio.crowdReady; window.READY = true;
</script></body></html>
